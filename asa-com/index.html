<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asa-Com">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>あさちゃんコミュニケーションボード Asa-Com</title>
<style>
/* ============================================================
   Asa-Com  /  Material Design 3 準拠トークン
   ============================================================ */
:root{
  --primary:#1A73E8;
  --primary-dark:#174EA6;
  --surface:#FFFFFF;
  --surface-variant:#F1F3F4;
  --outline:#DADCE0;
  --on-surface:#202124;
  --on-surface-variant:#5F6368;
  --shadow-1:0 1px 3px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.15);
  --shadow-2:0 2px 6px rgba(60,64,67,.3);
  --radius:28px;
  --ease:cubic-bezier(.2,0,0,1);
  --font-scale:1;
  --gap:8px;
  --edge:16px;
}
body.hc{
  --surface:#000000;
  --surface-variant:#0A0A0A;
  --outline:#FFFFFF;
  --on-surface:#FFFFFF;
  --on-surface-variant:#E0E0E0;
  --shadow-1:none;
  --shadow-2:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit}

/* ---------- レイアウト ---------- */
#app{
  height:100dvh;height:100vh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.topbar{
  flex:0 0 56px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 20px;
  border-bottom:1px solid var(--outline);
}
.brand{font-size:20px;font-weight:500;letter-spacing:.2px}
.menu-btn{
  position:relative;width:48px;height:48px;border:none;background:transparent;
  border-radius:50%;font-size:22px;line-height:1;color:var(--on-surface-variant);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.menu-btn .hold{
  position:absolute;inset:0;background:var(--primary);opacity:.18;
  transform:scaleY(0);transform-origin:bottom;
}
.stage{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:5fr 2fr;
}
@media (orientation:portrait){
  .stage{grid-template-columns:1fr;grid-template-rows:5fr 2fr}
  .logpane{border-left:none !important;border-top:1px solid var(--outline)}
}

/* ---------- 選択エリア ---------- */
.board{position:relative;min-width:0;min-height:0;padding:var(--edge)}
.choices{
  display:grid;gap:var(--gap);height:100%;
}
.choices[data-level="1"]{grid-template-columns:1fr 1fr;--base:calc(clamp(56px,10vw,140px)*var(--font-scale));--icon:calc(clamp(48px,8vw,96px)*var(--font-scale))}
.choices[data-level="2"]{grid-template-columns:repeat(3,1fr);--base:calc(clamp(40px,8vw,104px)*var(--font-scale));--icon:calc(clamp(40px,6.4vw,80px)*var(--font-scale))}
.choices[data-level="3"]{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;--base:calc(clamp(30px,5.4vw,76px)*var(--font-scale));--icon:calc(clamp(30px,4.8vw,68px)*var(--font-scale))}

.choice{
  position:relative;overflow:hidden;
  border:none;border-radius:var(--radius);
  background:var(--tint);color:var(--dark);
  box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.12em;padding:12px;
  transition:transform .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease);
  cursor:pointer;
}
body.hc .choice{background:#000;color:var(--c);border:4px solid var(--c)}
.choice .lbl{
  display:block;font-size:var(--base);font-weight:700;line-height:1.15;
  text-align:center;white-space:nowrap;
}
.choice .ico{width:var(--icon);height:var(--icon);flex:0 0 auto;fill:currentColor}
.choice:focus-visible{outline:4px solid var(--primary);outline-offset:-6px}
.choice.dwelling{background:var(--tint2)}
.choice.fired{background:var(--c);color:#fff;transform:scale(1.03);box-shadow:var(--shadow-2)}
body.hc .choice.fired{background:var(--c);color:#000}
.choices.locked .choice{pointer-events:none}

/* ドウェル進行バー */
.dwell{
  position:absolute;left:0;bottom:0;height:12px;width:100%;
  background:var(--c);opacity:.9;
  transform:scaleX(0);transform-origin:left center;
}
/* とりけす */
.undo{
  position:absolute;top:12px;right:12px;
  display:none;align-items:center;gap:6px;
  height:52px;padding:0 20px;border-radius:26px;
  border:2px solid var(--outline);background:var(--surface);color:var(--on-surface-variant);
  font-size:calc(19px*var(--font-scale));font-weight:600;
  box-shadow:var(--shadow-1);
}
.undo.show{display:flex}

/* 音声受付バナー */
.voice-banner{
  position:absolute;left:var(--edge);right:var(--edge);top:var(--edge);
  z-index:5;border-radius:20px;padding:14px 20px 10px;
  background:var(--primary);color:#fff;box-shadow:var(--shadow-2);
}
.voice-banner[hidden]{display:none}
.voice-banner .vb-row{display:flex;align-items:center;gap:12px;font-size:calc(22px*var(--font-scale));font-weight:600}
.voice-banner .ico{width:28px;height:28px;fill:#fff;flex:0 0 auto}
.voice-banner .vb-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;opacity:.9}
.vb-bar{margin-top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.vb-bar > i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center}

/* ---------- ログエリア ---------- */
.logpane{
  background:var(--surface-variant);border-left:1px solid var(--outline);
  display:flex;flex-direction:column;min-width:0;min-height:0;
}
.loglist{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px;
}
.logempty{
  height:100%;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--on-surface-variant);opacity:.65;font-size:calc(16px*var(--font-scale));line-height:1.6;
}
.logdate{
  margin:6px 0 12px;text-align:center;font-size:calc(12px*var(--font-scale));
  color:var(--on-surface-variant);
}
.logdate span{background:var(--surface);padding:3px 12px;border-radius:12px;border:1px solid var(--outline)}
.logitem{margin-bottom:16px;padding-left:12px;border-left:4px solid var(--c)}
.logitem .t{font-size:calc(12px*var(--font-scale));color:var(--on-surface-variant);letter-spacing:.4px}
.logitem .x{
  margin-left:16px;font-size:calc(20px*var(--font-scale));font-weight:500;
  color:var(--on-surface);line-height:1.4;word-break:break-word;
}
.logitem .x .mic{font-size:.72em;opacity:.55;margin-left:6px}

/* ---------- コントロールバー ---------- */
.ctrlbar{
  flex:0 0 auto;display:flex;gap:20px;justify-content:flex-end;align-items:flex-start;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--outline);
}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px}
.tg button{
  position:relative;width:64px;height:64px;border-radius:50%;
  border:2px solid var(--outline);background:var(--surface);color:var(--on-surface-variant);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.tg button .ico{width:30px;height:30px;fill:currentColor}
.tg button .slash{position:absolute;width:44px;height:3px;background:currentColor;transform:rotate(-45deg);border-radius:2px}
.tg.on button{background:var(--primary);border-color:var(--primary);color:#fff}
.tg.on button .slash{display:none}
.tg button:focus-visible{outline:4px solid var(--primary);outline-offset:3px}
.tg .cap{font-size:calc(11px*var(--font-scale));color:var(--on-surface-variant);white-space:nowrap}
.tg button .hold{position:absolute;inset:0;background:#fff;opacity:.35;transform:scaleY(0);transform-origin:bottom}
.tg button[disabled]{opacity:.35}

/* ---------- 設定シート ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(32,33,36,.5);z-index:20;
  display:flex;align-items:flex-end;justify-content:center;
}
.scrim[hidden]{display:none}
.sheet{
  width:min(720px,100%);max-height:86dvh;max-height:86vh;overflow-y:auto;
  background:var(--surface);border-radius:28px 28px 0 0;
  padding:8px 24px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.25);
}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--outline);margin:8px auto 14px}
.sheet h2{margin:0 0 18px;font-size:20px;font-weight:500}
.row{margin-bottom:20px}
.row .lab{font-size:14px;color:var(--on-surface-variant);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  min-height:48px;padding:0 18px;border-radius:24px;
  border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);
  font-size:16px;
}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--outline)}
.acts button{
  flex:1 1 180px;min-height:52px;border-radius:26px;border:1px solid var(--outline);
  background:var(--surface);color:var(--primary);font-size:16px;font-weight:600;
}
.acts button.danger{color:#C5221F}
.acts button.filled{background:var(--primary);border-color:var(--primary);color:#fff}
.note{margin-top:18px;font-size:12px;line-height:1.7;color:var(--on-surface-variant)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:#3C4043;color:#fff;padding:14px 22px;border-radius:8px;font-size:15px;
  z-index:40;box-shadow:var(--shadow-2);
}
.toast[hidden]{display:none}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">Asa-Com</div>
    <button class="menu-btn" id="menuBtn" aria-label="設定（長押しで開きます）"><span class="hold" id="menuHold"></span>⋮</button>
  </header>

  <div class="stage">
    <div class="board">
      <div class="voice-banner" id="voiceBanner" hidden>
        <div class="vb-row">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          <span id="vbTitle">聞いています…</span>
          <span class="vb-txt" id="vbText"></span>
        </div>
        <div class="vb-bar"><i id="vbBar"></i></div>
      </div>
      <div class="choices" id="choices" data-level="1"></div>
    </div>

    <aside class="logpane">
      <div class="loglist" id="logList" role="log" aria-live="polite" aria-label="やりとりのログ"></div>
      <div class="ctrlbar">
        <div class="tg" id="micTg">
          <button id="micBtn" aria-label="音声入力">
            <span class="hold" id="micHold"></span>
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            <span class="slash"></span>
          </button>
          <span class="cap" id="micCap">マイク ON</span>
        </div>
        <div class="tg" id="logTg">
          <button id="logBtn" aria-label="ログ記録">
            <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span class="slash"></span>
          </button>
          <span class="cap" id="logCap">ログ ON</span>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="設定">
    <div class="grab"></div>
    <h2>設定</h2>
    <div id="sheetRows"></div>
    <div class="acts">
      <button id="exportBtn">ログを書き出す（CSV）</button>
      <button id="clearBtn" class="danger">ログを消去</button>
      <button id="closeBtn" class="filled">とじる</button>
    </div>
    <p class="note" id="srNote"></p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ============================================================
   1. データ定義
   ============================================================ */
var ICONS = {
  check:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.3 14.7L6.1 12.1 7.7 10.5l3 3 5.6-5.6 1.6 1.6-7.2 7.2z',
  cancel:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 13.6L15.6 17 12 13.4 8.4 17 7 15.6 10.6 12 7 8.4 8.4 7 12 10.6 15.6 7 17 8.4 13.4 12 17 15.6z',
  remove:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM7 11h10v2H7v-2z',
  music:'M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z',
  healing:'M17.73 12.02l3.98-3.98a1 1 0 0 0 0-1.41l-4.34-4.34a1 1 0 0 0-1.41 0l-3.98 3.98L8 2.29a1.01 1.01 0 0 0-1.41 0L2.25 6.63a1 1 0 0 0 0 1.41l3.98 3.98L2.25 16a1 1 0 0 0 0 1.41l4.34 4.34a1 1 0 0 0 1.41 0l3.98-3.98 3.98 3.98a1 1 0 0 0 1.41 0l4.34-4.34a1 1 0 0 0 0-1.41l-3.98-3.98zM12 9a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2 2a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2-2a1 1 0 1 1 0-2 1 1 0 0 1 0 2z',
  thermostat:'M15 13V5a3 3 0 0 0-6 0v8a5 5 0 1 0 6 0zm-3-9a1 1 0 0 1 1 1v3h-2V5a1 1 0 0 1 1-1z'
};

var CHOICES = {
  yes:     {label:'はい',           icon:'check',      c:'#34A853', tint:'#E6F4EA', tint2:'#CEEAD6', dark:'#137333'},
  no:      {label:'いいえ',         icon:'cancel',     c:'#EA4335', tint:'#FCE8E6', tint2:'#F6CFCC', dark:'#C5221F'},
  neutral: {label:'どちらでもない', icon:'remove',     c:'#9AA0A6', tint:'#F1F3F4', tint2:'#E1E4E6', dark:'#3C4043', lines:['どちらでも','ない']},
  music:   {label:'音楽かけて',     icon:'music',      c:'#FBBC04', tint:'#FEF7E0', tint2:'#FDECC0', dark:'#8A6100'},
  pain:    {label:'体痛い・痒い',   icon:'healing',    c:'#F29900', tint:'#FEF0DC', tint2:'#FBE0BC', dark:'#A34B00', lines:['体痛い','痒い']},
  temp:    {label:'暑い・寒い',     icon:'thermostat', c:'#4285F4', tint:'#E8F0FE', tint2:'#D2E3FC', dark:'#174EA6'}
};
var LEVELS = {1:['yes','no'], 2:['yes','no','neutral'], 3:['yes','no','neutral','music','pain','temp']};
var FONT_SCALE = {normal:1, large:1.25, xlarge:1.5};

var SKEY='asacom.settings', LKEY='asacom.log';
var DEFAULTS = {
  level:1, dwellMs:1500, tapToConfirm:true, sound:true, speak:true, speakRate:1,
  fontScale:'normal', highContrast:false, micEnabled:true, logEnabled:true
};

var VOICE_WINDOW_MS = 15000;   // 音声受付時間
var SILENCE_MS      = 2000;    // 無音で締め切るまで
var UNDO_MS         = 5000;    // とりけす表示時間
var COOLDOWN_MS     = 1000;    // 確定後のクールダウン
var LOG_RENDER_MAX  = 200;     // 画面に出す最大件数
var LOG_STORE_MAX   = 3000;    // 保存する最大件数

/* ============================================================
   2. 状態
   ============================================================ */
var S = loadSettings();
var LOG = loadLog();
var locked = false;
var audioCtx = null;
var kicked = false;

var $ = function(id){ return document.getElementById(id); };
var choicesEl=$('choices'), logListEl=$('logList'), toastEl=$('toast');

function loadSettings(){
  var o = {};
  for(var k in DEFAULTS) o[k]=DEFAULTS[k];
  try{
    var raw = localStorage.getItem(SKEY);
    if(raw){ var p=JSON.parse(raw); for(var j in DEFAULTS){ if(p[j]!==undefined) o[j]=p[j]; } }
  }catch(e){}
  if(!LEVELS[o.level]) o.level = 1;
  return o;
}
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }

function loadLog(){
  try{ var a=JSON.parse(localStorage.getItem(LKEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function saveLog(){
  if(!S.logEnabled) return;
  try{
    if(LOG.length>LOG_STORE_MAX) LOG = LOG.slice(LOG.length-LOG_STORE_MAX);
    localStorage.setItem(LKEY, JSON.stringify(LOG));
  }catch(e){}
}

/* ============================================================
   3. 選択エリア
   ============================================================ */
function renderChoices(){
  var ids = LEVELS[S.level];
  choicesEl.setAttribute('data-level', String(S.level));
  choicesEl.innerHTML='';
  ids.forEach(function(id){
    var c = CHOICES[id];
    var b = document.createElement('button');
    b.className='choice';
    b.type='button';
    b.dataset.id=id;
    b.setAttribute('aria-label', c.label);
    b.style.setProperty('--c', c.c);
    b.style.setProperty('--tint', c.tint);
    b.style.setProperty('--tint2', c.tint2);
    b.style.setProperty('--dark', c.dark);
    b.innerHTML =
      '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICONS[c.icon]+'"/></svg>'+
      '<span class="lbl">'+(c.lines||[c.label]).join('<br>')+'</span>'+
      '<span class="dwell"></span>'+
      '<span class="undo"><svg class="ico" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.98 7.98 0 0 1 12.5 11c3.53 0 6.54 2.31 7.6 5.5l2.37-.78A10.5 10.5 0 0 0 12.5 8z"/></svg>とりけす</span>';
    bindChoice(b);
    choicesEl.appendChild(b);
  });
  fitLabels();
}

/* ラベルをボタンに収まる最大サイズへ自動調整（レベル・画面サイズ・文字サイズ設定に追随） */
function fitLabels(){
  Array.prototype.forEach.call(choicesEl.children, function(btn){
    var lbl = btn.querySelector('.lbl');
    var ico = btn.querySelector('.ico');
    if(!lbl || !btn.clientWidth) return;
    lbl.style.fontSize = '';
    var size = parseFloat(getComputedStyle(lbl).fontSize);
    var availW = btn.clientWidth  - 28;
    var availH = btn.clientHeight - 28 - ico.getBoundingClientRect().height - 8;
    var guard = 0;
    while(guard++ < 80 && size > 13 &&
          (lbl.scrollWidth > availW || lbl.scrollHeight > availH)){
      size *= 0.95;
      lbl.style.fontSize = size.toFixed(1)+'px';
    }
  });
}

function bindChoice(btn){
  var dwellEl = btn.querySelector('.dwell');
  var undoEl  = btn.querySelector('.undo');
  var timer = null;

  function startDwell(){
    if(locked || timer) return;
    btn.classList.add('dwelling');
    dwellEl.style.transition='none';
    dwellEl.style.transform='scaleX(0)';
    // 強制リフローの後にトランジション開始
    void dwellEl.offsetWidth;
    dwellEl.style.transition='transform '+S.dwellMs+'ms linear';
    dwellEl.style.transform='scaleX(1)';
    timer = setTimeout(function(){ timer=null; resetDwell(); commit(btn); }, S.dwellMs);
  }
  function resetDwell(){
    if(timer){ clearTimeout(timer); timer=null; }
    btn.classList.remove('dwelling');
    dwellEl.style.transition='none';
    dwellEl.style.transform='scaleX(0)';
  }

  btn.addEventListener('pointerenter', function(ev){
    // タップ即確定がONのタッチ操作ではドウェルを走らせない（二重確定の防止）
    if(ev.pointerType==='touch' && S.tapToConfirm) return;
    startDwell();
  });
  btn.addEventListener('pointerleave', resetDwell);
  btn.addEventListener('pointercancel', resetDwell);
  btn.addEventListener('pointerdown', function(ev){
    if(ev.pointerType==='touch' && !S.tapToConfirm) startDwell();
  });
  btn.addEventListener('pointerup', function(ev){
    if(ev.pointerType==='touch' && !S.tapToConfirm) resetDwell();
  });

  // タップ／スイッチコントロールのEnter・Space
  btn.addEventListener('click', function(ev){
    if(undoEl.contains(ev.target)) return;
    if(!S.tapToConfirm) return;
    resetDwell();
    commit(btn);
  });

  undoEl.addEventListener('click', function(ev){
    ev.stopPropagation();
    undo(btn);
  });
}

var undoTimer=null, undoEntry=null, undoBtn=null;

function commit(btn){
  if(locked) return;
  var id = btn.dataset.id, c = CHOICES[id];

  btn.classList.add('fired');
  setTimeout(function(){ btn.classList.remove('fired'); }, 400);
  beep(880);
  speak(c.label);

  var entry = addLog({type:'choice', choiceId:id, text:c.label});
  showUndo(btn, entry);
  lock(COOLDOWN_MS);
}

function lock(ms){
  locked = true;
  choicesEl.classList.add('locked');
  setTimeout(function(){ locked=false; choicesEl.classList.remove('locked'); }, ms);
}

function showUndo(btn, entry){
  hideUndo();
  undoBtn = btn; undoEntry = entry;
  btn.querySelector('.undo').classList.add('show');
  undoTimer = setTimeout(hideUndo, UNDO_MS);
}
function hideUndo(){
  if(undoTimer){ clearTimeout(undoTimer); undoTimer=null; }
  if(undoBtn){ undoBtn.querySelector('.undo').classList.remove('show'); }
  undoBtn=null; undoEntry=null;
}
function undo(btn){
  if(undoEntry){
    for(var i=LOG.length-1;i>=0;i--){
      if(LOG[i].id===undoEntry.id){ LOG.splice(i,1); break; }
    }
    saveLog();
    renderLog();
    toast('とりけしました');
  }
  hideUndo();
}

/* ============================================================
   4. ログ
   ============================================================ */
function nowParts(){
  var d = new Date();
  var p = function(n){ return (n<10?'0':'')+n; };
  var tz = -d.getTimezoneOffset();
  var sign = tz>=0?'+':'-'; tz=Math.abs(tz);
  return {
    datetime: d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+
              p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+
              sign+p(Math.floor(tz/60))+':'+p(tz%60),
    date: d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),
    time: p(d.getHours())+':'+p(d.getMinutes())
  };
}

function addLog(o){
  if(!S.logEnabled) return null;      // ログOFF：表示も保存もしない
  var t = nowParts();
  var e = {
    id: Math.random().toString(36).slice(2,10),
    datetime: t.datetime, date: t.date, time: t.time,
    type: o.type, choiceId: o.choiceId||'', text: o.text, level: S.level
  };
  LOG.push(e);
  saveLog();
  appendLogItem(e, true);
  return e;
}

function logItemEl(e){
  var wrap = document.createElement('div');
  wrap.className='logitem';
  var color = (e.type==='choice' && CHOICES[e.choiceId]) ? CHOICES[e.choiceId].c : '#9AA0A6';
  wrap.style.setProperty('--c', color);
  var t = document.createElement('div'); t.className='t'; t.textContent=e.time;
  var x = document.createElement('div'); x.className='x'; x.textContent=e.text;
  if(e.type==='voice'){
    var m = document.createElement('span'); m.className='mic'; m.textContent='🎤';
    x.appendChild(m);
  }
  wrap.appendChild(t); wrap.appendChild(x);
  return wrap;
}
function dateEl(dateStr){
  var d = document.createElement('div');
  d.className='logdate';
  var parts = dateStr.split('-');
  d.innerHTML = '<span>'+Number(parts[1])+'月'+Number(parts[2])+'日</span>';
  return d;
}

var lastRenderedDate = null;

function appendLogItem(e, scroll){
  if(!S.logEnabled) return;
  var ph = logListEl.querySelector('.logempty');
  if(ph) { logListEl.innerHTML=''; lastRenderedDate=null; }
  if(e.date !== lastRenderedDate){
    logListEl.appendChild(dateEl(e.date));
    lastRenderedDate = e.date;
  }
  logListEl.appendChild(logItemEl(e));
  if(scroll!==false) logListEl.scrollTop = logListEl.scrollHeight;
}

function renderLog(){
  logListEl.innerHTML='';
  lastRenderedDate=null;
  if(!S.logEnabled){
    logListEl.innerHTML='<div class="logempty">ログはOFFです<br>記録は残りません</div>';
    return;
  }
  if(!LOG.length){
    logListEl.innerHTML='<div class="logempty">ここに<br>やりとりが<br>表示されます</div>';
    return;
  }
  var start = Math.max(0, LOG.length-LOG_RENDER_MAX);
  for(var i=start;i<LOG.length;i++) appendLogItem(LOG[i], false);
  logListEl.scrollTop = logListEl.scrollHeight;
}

function exportCsv(){
  if(!LOG.length){ toast('書き出すログがありません'); return; }
  var rows = ['datetime,time,type,label,level'];
  LOG.forEach(function(e){
    rows.push([e.datetime, e.time, e.type, '"'+String(e.text).replace(/"/g,'""')+'"', e.level].join(','));
  });
  var t = nowParts().date.replace(/-/g,'');
  var blob = new Blob(['﻿'+rows.join('\r\n')+'\r\n'], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='asacom_log_'+t+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('ログを書き出しました');
}

function clearLog(){
  if(!window.confirm('ログをすべて消去します。よろしいですか？')) return;
  LOG = [];
  try{ localStorage.removeItem(LKEY); }catch(e){}
  renderLog();
  toast('ログを消去しました');
}

/* ============================================================
   5. 効果音・読み上げ
   ============================================================ */
function beep(freq){
  if(!S.sound) return;
  try{
    if(!audioCtx){
      var AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq||880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.2);
  }catch(e){}
}

function speak(text){
  if(!S.speak || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate=S.speakRate; u.pitch=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   6. 音声入力（「ヘイ！あさちゃん」）
   ============================================================ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, recWanted=false, restartTimer=null;
var listening=false, winTimer=null, silenceTimer=null, tickTimer=null, winText='', winEndAt=0;

var bannerEl=$('voiceBanner'), vbBar=$('vbBar'), vbTitle=$('vbTitle'), vbText=$('vbText');

function kanaNorm(s){
  return String(s)
    .replace(/[Ａ-Ｚａ-ｚ０-９！]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0xFEE0); })
    .replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); })
    .replace(/[\s　！!、。,.・ー]/g,'')
    .toLowerCase();
}
// 「ヘイ！あさちゃん」＋表記ゆれ
var WAKE_RE = /(へい|へー|hey|hei|hay)(.{0,2}?)(あさ|朝)ちゃん/;
function hasWake(s){ return WAKE_RE.test(kanaNorm(s)); }
// 元テキストからウェイクワード部分を取り除く
var WAKE_STRIP_RE = /^[\s\S]*?(?:ヘイ|へい|ヘー|へー|hey|Hey|HEY|hei|Hei)[\s　!！、。,.]*(?:あさ|アサ|朝)ちゃん[\s　!！、。,.]*/i;
function stripWake(s){
  if(hasWake(s)) return s.replace(WAKE_STRIP_RE,'');
  return s;
}

function startSR(){
  if(!SR || !S.micEnabled) return;
  recWanted = true;
  if(rec) return;
  try{
    rec = new SR();
    rec.lang='ja-JP';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    rec.onresult = onResult;
    rec.onerror = function(ev){
      if(ev && (ev.error==='not-allowed'||ev.error==='service-not-allowed')){
        recWanted=false;
        S.micEnabled=false; saveSettings(); updateToggles();
        toast('マイクの使用が許可されていません');
      }
    };
    rec.onend = function(){
      rec=null;
      if(recWanted && S.micEnabled){
        clearTimeout(restartTimer);
        restartTimer = setTimeout(startSR, 500);
      }
    };
    rec.start();
  }catch(e){ rec=null; }
}

function stopSR(){
  recWanted=false;
  clearTimeout(restartTimer);
  closeWindow(false);
  if(rec){ try{ rec.abort(); }catch(e){} rec=null; }
}

function onResult(ev){
  var fin='', itm='';
  for(var i=ev.resultIndex;i<ev.results.length;i++){
    var r=ev.results[i];
    if(r.isFinal) fin += r[0].transcript; else itm += r[0].transcript;
  }
  if(!listening){
    if(hasWake(fin+itm)){
      openWindow();
      var rest = stripWake(fin);
      if(rest && rest.trim()) pushWinText(rest);
    }
    return;
  }
  // 受付中
  if(itm) vbText.textContent = itm.slice(-40);
  if(fin){
    pushWinText(stripWake(fin));
    resetSilence();
  }
}

function pushWinText(t){
  t = String(t||'').trim();
  if(!t) return;
  winText += t;
  vbText.textContent = winText.slice(-40);
}

function openWindow(){
  if(listening) return;
  listening = true;
  winText = '';
  vbText.textContent = '';
  bannerEl.hidden = false;
  winEndAt = Date.now() + VOICE_WINDOW_MS;
  beep(660);
  tick();
  clearTimeout(winTimer);
  winTimer = setTimeout(function(){ closeWindow(true); }, VOICE_WINDOW_MS);
  tickTimer = setInterval(tick, 200);
}

function tick(){
  var left = Math.max(0, winEndAt - Date.now());
  vbTitle.textContent = '聞いています… 残り ' + Math.ceil(left/1000) + '秒';
  vbBar.style.transform = 'scaleX(' + (left/VOICE_WINDOW_MS) + ')';
}

function resetSilence(){
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(function(){ closeWindow(true); }, SILENCE_MS);
}

function closeWindow(commitText){
  clearTimeout(winTimer); clearTimeout(silenceTimer); clearInterval(tickTimer);
  winTimer=silenceTimer=tickTimer=null;
  if(!listening) return;
  listening = false;
  bannerEl.hidden = true;
  var t = winText.trim();
  winText='';
  vbText.textContent='';
  if(commitText && t) addLog({type:'voice', text:t});
}

/* ============================================================
   7. トグル（マイク／ログ）
   ============================================================ */
function updateToggles(){
  var micTg=$('micTg'), logTg=$('logTg');
  micTg.classList.toggle('on', !!S.micEnabled);
  logTg.classList.toggle('on', !!S.logEnabled);
  $('micCap').textContent = 'マイク ' + (S.micEnabled?'ON':'OFF');
  $('logCap').textContent = 'ログ '   + (S.logEnabled?'ON':'OFF');
  $('micBtn').setAttribute('aria-pressed', S.micEnabled?'true':'false');
  $('logBtn').setAttribute('aria-pressed', S.logEnabled?'true':'false');
  if(!SR){
    $('micBtn').disabled = true;
    $('micCap').textContent = 'マイク 非対応';
    $('micBtn').title = 'このブラウザでは音声入力は使えません';
  }
}

/* 長押し（1秒）＋短押しを見分ける汎用ヘルパー */
function bindHold(btn, holdEl, ms, onHold, onTap){
  var t=null, fired=false;
  function down(){
    fired=false;
    if(holdEl){
      holdEl.style.transition='none'; holdEl.style.transform='scaleY(0)';
      void holdEl.offsetWidth;
      holdEl.style.transition='transform '+ms+'ms linear';
      holdEl.style.transform='scaleY(1)';
    }
    t = setTimeout(function(){ fired=true; reset(); onHold(); }, ms);
  }
  function reset(){
    if(t){ clearTimeout(t); t=null; }
    if(holdEl){ holdEl.style.transition='none'; holdEl.style.transform='scaleY(0)'; }
  }
  btn.addEventListener('pointerdown', function(e){ e.preventDefault(); down(); });
  btn.addEventListener('pointerup', function(){ var f=fired; reset(); if(!f && onTap) onTap(); });
  btn.addEventListener('pointerleave', reset);
  btn.addEventListener('pointercancel', reset);
  btn.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onTap?onTap():onHold(); } });
}

/* ============================================================
   8. 設定シート
   ============================================================ */
var SHEET_ROWS = [
  {k:'level',        t:'レベル',           o:[[1,'1 ／ 2択'],[2,'2 ／ 3択'],[3,'3 ／ 6択']]},
  {k:'dwellMs',      t:'確定までの時間',   o:[[500,'0.5秒'],[1000,'1.0秒'],[1500,'1.5秒'],[2000,'2.0秒'],[3000,'3.0秒']]},
  {k:'tapToConfirm', t:'タップで即確定',   o:[[true,'ON'],[false,'OFF']]},
  {k:'sound',        t:'効果音',           o:[[true,'ON'],[false,'OFF']]},
  {k:'speak',        t:'読み上げ',         o:[[true,'ON'],[false,'OFF']]},
  {k:'speakRate',    t:'読み上げ速度',     o:[[0.8,'遅い'],[1,'ふつう'],[1.3,'速い']]},
  {k:'fontScale',    t:'文字サイズ',       o:[['normal','標準'],['large','大'],['xlarge','特大']]},
  {k:'highContrast', t:'ハイコントラスト', o:[[false,'OFF'],[true,'ON']]}
];

function buildSheet(){
  var host=$('sheetRows');
  host.innerHTML='';
  SHEET_ROWS.forEach(function(row){
    var d=document.createElement('div'); d.className='row';
    var l=document.createElement('div'); l.className='lab'; l.textContent=row.t;
    var seg=document.createElement('div'); seg.className='seg';
    row.o.forEach(function(pair){
      var b=document.createElement('button');
      b.type='button'; b.textContent=pair[1];
      b.dataset.k=row.k; b.dataset.v=JSON.stringify(pair[0]);
      b.addEventListener('click', function(){
        S[row.k] = JSON.parse(b.dataset.v);
        saveSettings(); applySettings(); syncSheet();
      });
      seg.appendChild(b);
    });
    d.appendChild(l); d.appendChild(seg); host.appendChild(d);
  });
  $('srNote').textContent = SR
    ? '音声入力は「ヘイ！あさちゃん」と呼びかけると15秒間だけONになります。マイクのアイコンを長押しすると、呼びかけなしでも音声入力を始められます。'
    : 'このブラウザ／端末では音声入力（音声認識）が使えません。選択ボタンとログ機能はそのままお使いいただけます。';
  syncSheet();
}
function syncSheet(){
  var btns=$('sheetRows').querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    var b=btns[i];
    b.setAttribute('aria-pressed', JSON.stringify(S[b.dataset.k])===b.dataset.v ? 'true':'false');
  }
}
function openSheet(){ buildSheet(); $('scrim').hidden=false; }
function closeSheet(){ $('scrim').hidden=true; }

/* ============================================================
   9. 設定の反映
   ============================================================ */
function applySettings(){
  document.documentElement.style.setProperty('--font-scale', FONT_SCALE[S.fontScale]||1);
  document.body.classList.toggle('hc', !!S.highContrast);
  renderChoices();
  renderLog();
  updateToggles();
  if(S.micEnabled) startSR(); else stopSR();
}

/* ============================================================
   10. その他ユーティリティ
   ============================================================ */
var toastTimer=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toastEl.hidden=true; }, 2200);
}

var wakeLock=null;
function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(w){
    wakeLock=w;
    w.addEventListener('release', function(){ wakeLock=null; });
  }).catch(function(){});
}

/* ============================================================
   11. 初期化
   ============================================================ */
function init(){
  applySettings();

  bindHold($('menuBtn'), $('menuHold'), 1000, openSheet, null);
  bindHold($('micBtn'), $('micHold'), 1000,
    function(){ // 長押し：呼びかけなしで受付開始
      if(!SR) return;
      if(!S.micEnabled){ S.micEnabled=true; saveSettings(); updateToggles(); }
      startSR(); openWindow();
    },
    function(){ // 短押し：ON/OFF
      if(!SR) return;
      S.micEnabled = !S.micEnabled; saveSettings(); updateToggles();
      if(S.micEnabled) startSR(); else stopSR();
      toast('マイクを'+(S.micEnabled?'ONにしました':'OFFにしました'));
    });

  $('logBtn').addEventListener('click', function(){
    S.logEnabled = !S.logEnabled; saveSettings();
    updateToggles(); renderLog();
    toast('ログを'+(S.logEnabled?'ONにしました':'OFFにしました'));
  });

  $('exportBtn').addEventListener('click', exportCsv);
  $('clearBtn').addEventListener('click', clearLog);
  $('closeBtn').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', function(e){ if(e.target===$('scrim')) closeSheet(); });

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });

  // iOSでは最初のユーザー操作がないと音声・画面ロック解除が使えない
  document.addEventListener('pointerdown', function(){
    if(kicked) return;
    kicked = true;
    beep(0.0001);                 // AudioContextの起こし
    if(S.micEnabled) startSR();
    requestWakeLock();
  }, {once:false});

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){
      if(S.micEnabled) startSR();
      requestWakeLock();
    }else{
      closeWindow(false);
    }
  });

  var refitTimer=null;
  window.addEventListener('resize', function(){
    clearTimeout(refitTimer);
    refitTimer = setTimeout(fitLabels, 120);
  });
  window.addEventListener('orientationchange', function(){ setTimeout(fitLabels, 300); });

  // 拡大・長押しメニューの抑止
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  var lastTouch=0;
  document.addEventListener('touchend', function(e){
    var t=Date.now();
    if(t-lastTouch<350) e.preventDefault();
    lastTouch=t;
  }, {passive:false});
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
